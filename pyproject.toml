[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ilias-mcp"
version = "0.1.0"
description = "CLI and MCP server for ILIAS with a pluggable login-provider architecture (built-in: KIT via Shibboleth)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Julian Wiest" }]
dependencies = [
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "python-dotenv>=1.0",
    "typer>=0.12",
    "rich>=13.7",
    "mcp>=1.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "responses>=0.25",
    "ruff>=0.4",
]

[project.scripts]
ilias-mcp = "ilias_mcp.cli:main"
ilias-mcp-server = "ilias_mcp.mcp_server:main"

[project.entry-points."ilias_mcp.providers"]
kit = "ilias_mcp.providers.kit:KITProvider"

[tool.hatch.build.targets.wheel]
packages = ["src/ilias_mcp"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# B008: typer's `= typer.Option(...)` default-value idiom is the documented
# way to declare CLI options and is intentional, not a real mutable-default bug.
ignore = ["B008"]
